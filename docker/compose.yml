# Petey: docker compose -f docker/compose.yml --env-file .env up --build
name: petey

x-app: &app
  image: ghcr.io/jackhiles/petey:${PETEY_VERSION:-latest}
  build:
    context: ..
    dockerfile: docker/Dockerfile
  restart: unless-stopped
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-petey}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-petey}
    APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
    APP_URL: ${APP_URL:-http://localhost:3000}
    LOG_LEVEL: ${LOG_LEVEL:-info}
  depends_on:
    db:
      condition: service_healthy

services:
  web:
    <<: *app
    command: ["sh", "docker/start-web.sh"]
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *app
    command: ["sh", "docker/start-worker.sh"]
    depends_on:
      db:
        condition: service_healthy
      web:
        # web applies migrations on start; the worker waits for it.
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-petey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-petey}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
