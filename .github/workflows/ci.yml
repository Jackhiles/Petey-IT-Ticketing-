name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: petey
          POSTGRES_PASSWORD: petey
          POSTGRES_DB: petey_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U petey" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The database name must contain "test": tests empty it before they run.
      DATABASE_URL: postgresql://petey:petey@localhost:5432/petey_test
      APP_SECRET: ci-only-secret-not-for-production-0123456789
      APP_URL: http://localhost:3000
      # The end-to-end run signs in many times a second from one address.
      AUTH_RATE_LIMIT: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:deploy
      - run: pnpm test
      - run: pnpm build
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  image:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: petey:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
